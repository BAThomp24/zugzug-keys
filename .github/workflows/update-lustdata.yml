name: Update WCL lust data

# Weekly regeneration of LustDataWCL.lua from the cron worker's derived
# consensus (which itself refreshes Wednesdays 04:00 UTC). Runs Thursdays
# so the worker's fresh weekly data is always in. A commit here triggers
# the normal release workflow, which ships the new zip to CurseForge.
on:
  schedule:
    - cron: "0 6 * * 4" # Thursday 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate LustDataWCL.lua from /api/lust-calls
        run: npx tsx scripts/update-lustdata.ts

      - name: Commit if changed
        run: |
          if git diff --quiet LustDataWCL.lua; then
            echo "LustDataWCL.lua unchanged — nothing to ship."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LustDataWCL.lua
          git commit -m "data: weekly WCL lust-call refresh"
          git push
