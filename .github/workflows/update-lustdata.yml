name: Update WCL lust data

# Weekly regeneration of LustDataWCL.lua, derived DIRECTLY from
# WarcraftLogs top M+ logs via the vendored scripts/shared/wclLust.ts —
# no website/worker dependency (the zugzug.info infrastructure was
# decommissioned). The sweep is ~1.7k paced requests, ~15-20 minutes;
# runners get a fresh egress IP per run, so WCL's per-IP throttle isn't
# the problem it was on shared worker IPs. Runs Thursdays so the week's
# reset logs have accumulated. A commit here does NOT trigger the release
# workflow on its own - pushes made with GITHUB_TOKEN never do - so this
# job dispatches release.yml itself once it has committed.
on:
  schedule:
    - cron: "0 6 * * 4" # Thursday 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # Sweep is ~45 min; if the WCL hourly points budget runs dry mid-sweep
    # the fetch layer waits it out in 5-min steps (up to ~72 min extra).
    timeout-minutes: 150
    permissions:
      contents: write
      actions: write # to dispatch the release below

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate LustDataWCL.lua from WarcraftLogs
        env:
          WCL_V2_CLIENT_ID: ${{ secrets.WCL_V2_CLIENT_ID }}
          WCL_V2_CLIENT_SECRET: ${{ secrets.WCL_V2_CLIENT_SECRET }}
        run: npx tsx scripts/update-lustdata.ts

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet LustDataWCL.lua; then
            echo "LustDataWCL.lua unchanged — nothing to ship."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LustDataWCL.lua
          git commit -m "data: weekly WCL lust-call refresh"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN deliberately does NOT trigger other
      # workflows — GitHub's guard against recursion. So the release this
      # step's comment used to promise never actually happened: every
      # Release in the history came from a human push, and the weekly
      # data sat on main until somebody else pushed something. Ask for
      # the release explicitly instead.
      - name: Ship it
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref main
